<svg xmlns="http://www.w3.org/2000/svg"
     width="720"
     height="376"
     viewBox="0 0 720 376"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Tootekategooriate võrdlus</title>

  <desc id="desc">
    Analüüsitud kategooriaid: 5.
    Kõige rohkem tooteid: meeste riided – 82.
    Kõige suurem müügikogus: meeste riided – 4121.
    Kõrgeim keskmine jaehind: jalanõud – 214,10 €.
    Suurim keskmine müük toote kohta: laste riided – 64,33.
  </desc>

  <!-- Taust -->
  <rect width="720" height="376" fill="#F7F1E6"/>

  <!-- Pealkiri -->
  <text x="36"
        y="48"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="25"
        font-weight="700"
        fill="#2F302B">
    Tootekategooriate võrdlus
  </text>

  <!-- Päis -->
  <rect x="36" y="72" width="648" height="44"
        rx="2" fill="#5E7361"/>

  <!-- Andmeread: esimene rida heledam -->
  <rect x="36" y="116" width="648" height="44" fill="#F9EBE4"/>
  <rect x="36" y="160" width="648" height="44" fill="#F1D2C6"/>
  <rect x="36" y="204" width="648" height="44" fill="#F9EBE4"/>
  <rect x="36" y="248" width="648" height="44" fill="#F1D2C6"/>
  <rect x="36" y="292" width="648" height="44"
        rx="2" fill="#F9EBE4"/>

  <!-- Eraldusjooned -->
  <g stroke="#D6D0C5" stroke-width="1">
    <line x1="36" y1="160" x2="684" y2="160"/>
    <line x1="36" y1="204" x2="684" y2="204"/>
    <line x1="36" y1="248" x2="684" y2="248"/>
    <line x1="36" y1="292" x2="684" y2="292"/>
  </g>

  <!-- Tabeli tekst -->
  <g font-family="Georgia, 'Times New Roman', serif"
     font-size="16">

    <!-- Päise tekst -->
    <g font-weight="700" fill="#F7F1E6">
      <text x="56" y="100">Näitaja</text>
      <text x="660" y="100" text-anchor="end">Tulemus</text>
    </g>

    <!-- Näitajad -->
    <g fill="#2F302B">
      <text x="56" y="144">Analüüsitud kategooriaid</text>
      <text x="56" y="188">Kõige rohkem tooteid</text>
      <text x="56" y="232">Kõige suurem müügikogus</text>
      <text x="56" y="276">Kõrgeim keskmine jaehind</text>
      <text x="56" y="320">Suurim keskmine müük toote kohta</text>
    </g>

    <!-- Tulemused -->
    <g fill="#2F302B"
       font-weight="700"
       text-anchor="end">
      <text x="660" y="144">5</text>
      <text x="660" y="188">meeste riided – 82</text>
      <text x="660" y="232">meeste riided – 4121</text>
      <text x="660" y="276">jalanõud – 214,10 €</text>
      <text x="660" y="320">laste riided – 64,33</text>
    </g>

  </g>
</svg>
